<div *ngIf="course" class="lesson-intro">
  <div>
    <div class="eyebrow">{{ course.level }}</div>
    <h2>{{ course.title }}</h2>
    <p>{{ course.description }}</p>
  </div>
  <div class="lesson-emoji">📚</div>
</div>
<div class="page-loader" *ngIf="loading"><span class="spinner"></span> Đang tải bài học...</div>
<div class="panel" *ngIf="!loading">
  <div class="course-progress-line" *ngIf="lessons.length">
    <span>Hoàn thành {{ completedCount() }}/{{ lessons.length }} bài</span>
    <div class="bar"><span [style.width.%]="lessons.length ? (completedCount() * 100 / lessons.length) : 0"></span></div>
  </div>
  <div class="lesson-row" *ngFor="let lesson of lessons">
    <div class="lesson-number">{{ lesson.sort_order }}</div>
    <div class="lesson-info">
      <strong>{{ lesson.title }}</strong>
      <small>{{ lesson.topic }}</small>
    </div>
    <span class="status" *ngIf="progressMap.get(lesson.id)?.status === 'completed'">✓ Đã học</span>
    <a class="tiny-btn" [routerLink]="['/lessons', lesson.id]">Học</a>
  </div>
</div>
<a routerLink="/courses" class="text-btn">← Quay lại</a>
