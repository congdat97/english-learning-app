<div class="settings">
  <header class="settings-head">
    <h2>Cài đặt học tập</h2>
    <p>Tùy chỉnh trải nghiệm học của bạn</p>
  </header>

  <div class="settings-grid">
    <div class="card">
      <h3>Giọng đọc</h3>
      <p class="hint">Chỉ hiện giọng tiếng Anh khả dụng trên máy bạn</p>
      <select name="voice" [(ngModel)]="voice">
        <option value="">Mặc định</option>
        <option *ngFor="let v of voices" [value]="v.name">{{ v.name }} ({{ v.lang }})</option>
      </select>
      <button type="button" class="text-btn" style="margin-top:.5rem" (click)="testVoice()">🔊 Thử giọng</button>
    </div>

    <div class="card theme-card-block">
      <h3>Chủ đề màu</h3>
      <p class="hint">Thay đổi màu giao diện — hiện tại: {{ themeService.currentTheme.name }}</p>

      <div class="settings-section-label">Chế độ hiển thị</div>
      <div class="mode-switch">
        <button type="button" class="mode-option" [class.active]="themeService.currentMode === 'light'" (click)="themeService.setMode('light')">☀️ Sáng</button>
        <button type="button" class="mode-option" [class.active]="themeService.currentMode === 'dark'" (click)="themeService.setMode('dark')">🌙 Tối</button>
      </div>

      <div class="settings-section-label">Bảng màu giao diện</div>
      <div class="theme-grid">
        <button *ngFor="let t of themeService.themes"
                type="button"
                class="theme-card"
                [class.active]="themeService.currentTheme.id === t.id"
                (click)="selectTheme(t.id)">
          <span class="theme-check">✓</span>
          <span class="theme-swatch" [style.background]="'linear-gradient(135deg, ' + t.primary + ', ' + t.secondary + ')'">
            <span class="theme-swatch-bar"></span>
            <span class="theme-swatch-bar" style="opacity:.55"></span>
            <span class="theme-swatch-bar" style="opacity:.3"></span>
          </span>
          <span class="theme-name">{{ t.name }} <em class="theme-badge">{{ t.collection }}</em></span>
          <span class="theme-sub">{{ t.primary }} · {{ t.secondary }}</span>
        </button>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="primary" [disabled]="saving" (click)="save()">{{ saving ? 'Đang lưu...' : 'Lưu cài đặt' }}</button>
    <a routerLink="/dashboard" class="text-btn">← Quay lại</a>
    <span *ngIf="saveMsg" class="save-msg">{{ saveMsg }}</span>
  </div>
</div>
