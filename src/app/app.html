<div class="app">
  <button class="menu-toggle" (click)="toggleMenu()" aria-label="Menu">☰</button>
  <aside class="sidebar" [class.open]="menuOpen">
    <div class="brand"><div class="logo">✦</div> English Step by Step</div>
    <div>
      <div class="nav-label">MENU CHÍNH</div>
      <nav class="nav" (click)="closeMenu()">
        <a routerLink="/dashboard" routerLinkActive="active"><span class="nav-icon">⌂</span>Trang chủ</a>
        <a routerLink="/courses" routerLinkActive="active"><span class="nav-icon">▤</span>Khóa học</a>
        <a routerLink="/bookmarks" routerLinkActive="active"><span class="nav-icon">◇</span>Sổ từ vựng</a>
        <a routerLink="/progress" routerLinkActive="active"><span class="nav-icon">◷</span>Tiến độ</a>
        <a routerLink="/settings" routerLinkActive="active"><span class="nav-icon">⚙</span>Cài đặt</a>
      </nav>
    </div>
    <div class="sidebar-bottom">
      <strong>🌱 Mỗi ngày một chút</strong>
      <p>Học đều đặn để tiến bộ từng bước.</p>
      <div class="mini-progress"><span style="width:12%"></span></div>
    </div>
  </aside>
  <main>
    <header class="topbar">
      <div>
        <div class="eyebrow">THỨ TỐT ĐẸP BẮT ĐẦU TỪ NHỮNG ĐIỀU NHỎ</div>
        <h1>Chào mừng bạn trở lại! 👋</h1>
      </div>
      <div class="profile"><span>Người học mới</span><div class="avatar">A</div></div>
    </header>
    <button type="button" class="settings-button" (click)="openSettings()" title="Cài đặt giao diện" aria-label="Cài đặt giao diện">\r\n      <span>⚙️</span>\r\n    </button>\r\n    <router-outlet />\r\n  </main>
</div>
